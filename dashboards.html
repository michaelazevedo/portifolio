<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodizio de Dashboards GBS</title>
    <link rel="icon" href="ico.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #05070d;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .viewer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #05070d;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #05070d;
        }

        .control-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            color: #fff;
            background: rgba(5, 7, 13, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 180ms ease, opacity 180ms ease, transform 180ms ease;
        }

        .control-toggle:hover,
        body.controls-open .control-toggle {
            background: rgba(5, 7, 13, 0.86);
            transform: translateY(-1px);
        }

        .control-toggle span,
        .control-toggle::before,
        .control-toggle::after {
            content: "";
            display: block;
            width: 16px;
            height: 2px;
            background: #e2e8f0;
            border-radius: 99px;
        }

        .control-toggle {
            gap: 3px;
            flex-direction: column;
        }

        .topbar {
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: min(560px, calc(100vw - 20px));
            padding: 8px;
            color: #fff;
            background: rgba(5, 7, 13, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top right;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        body.controls-open .topbar,
        .topbar:focus-within {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .title {
            min-width: 0;
            flex: 1 1 auto;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .counter {
            font-size: 12px;
            color: #cbd5e1;
            white-space: nowrap;
        }

        .progress {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 11;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00d4ff;
            transition: width 1s linear;
        }

        button {
            width: 34px;
            height: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #e2e8f0;
            background: #05070d;
            z-index: 1;
            font-size: 16px;
            letter-spacing: 0;
        }
    </style>
</head>
<body>
    <div class="viewer">
        <div class="loading" id="loading">Carregando dashboard...</div>
        <iframe id="dashboardFrame" title="Dashboard em exibicao" allowfullscreen></iframe>
    </div>

    <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <button type="button" class="control-toggle" id="controlToggle" title="Controles" aria-label="Controles">
        <span></span>
    </button>

    <div class="topbar" id="topbar">
        <div class="title" id="dashboardTitle">Dashboard</div>
        <div class="counter" id="counter">1 / 1</div>
        <button type="button" id="prevBtn" title="Anterior">&lt;</button>
        <button type="button" id="pauseBtn" title="Pausar">||</button>
        <button type="button" id="nextBtn" title="Proximo">&gt;</button>
        <button type="button" id="fullscreenBtn" title="Tela cheia">[]</button>
    </div>

    <script>
        const TEMPO_POR_RELATORIO_MINUTOS = 5;

        const dashboards = [
            {
                titulo: "Dashboard de Vendas",
                url: "https://app.powerbi.com/view?r=eyJrIjoiNGE5OTFiYmMtN2M0Yi00NjBkLTgwZWYtMGUwM2U2MDllZTg2IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            {
                titulo: "Analises Transportados",
                url: "https://app.powerbi.com/view?r=eyJrIjoiZDBhMTYxYjItZmJhNS00ZjIxLWIyOTYtMDU2MWViMDM5MTFkIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            {
                titulo: "Dashboard de Vendas JBL",
                url: "https://app.powerbi.com/view?r=eyJrIjoiY2ZjNzRkNzEtNWE1YS00Nzk3LWFhNDEtZDM3NTYyYmJjOGE4IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            {
                titulo: "Metropolitano",
                url: "https://app.powerbi.com/view?r=eyJrIjoiODAwZTY0MDAtZTU2OC00NTVkLTlmZmMtMmRkNzhmM2E1MTdmIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            {
                titulo: "Express",
                url: "https://app.powerbi.com/view?r=eyJrIjoiNTZhZDQ5M2UtN2FmMy00MzM0LWIzYmUtZmI0NGM2YTJmYTlkIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            {
                titulo: "Dashboard Venda de Seguro",
                url: "https://app.powerbi.com/view?r=eyJrIjoiMjdlYjBhZTctODJhZi00ODRhLTgxZTItMzJhNzVlMTc4NmU3IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            // {
            //     titulo: "Turismo",
            //     url: "https://app.powerbi.com/view?r=eyJrIjoiYjk1YTM5OTQtN2ZhMi00OWEzLTg1ODQtZjZkNjM1ZDc5ZTJiIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            // },
            {
                titulo: "Projeto Saude",
                url: "https://app.powerbi.com/view?r=eyJrIjoiNjM1ZmFhZDQtYzQzYi00ZjQ0LWEyNTMtMjA0MDM4M2NkZTlkIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            },
            {
                titulo: "Relatorio Infracoes",
                url: "https://app.powerbi.com/view?r=eyJrIjoiYTE0ODdjYWYtYjM1Mi00YmU0LTliZDAtZTFiMTY1Y2UzZWQ1IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9"
            }
        ];

        const params = new URLSearchParams(window.location.search);
        const minutosParam = Number(params.get("minutos"));
        const intervaloMs = (Number.isFinite(minutosParam) && minutosParam > 0 ? minutosParam : TEMPO_POR_RELATORIO_MINUTOS) * 60 * 1000;

        const frame = document.getElementById("dashboardFrame");
        const loading = document.getElementById("loading");
        const title = document.getElementById("dashboardTitle");
        const counter = document.getElementById("counter");
        const progressBar = document.getElementById("progressBar");
        const pauseBtn = document.getElementById("pauseBtn");
        const controlToggle = document.getElementById("controlToggle");
        const topbar = document.getElementById("topbar");

        let atual = 0;
        let pausado = false;
        let inicio = Date.now();
        let timer = null;
        let progressTimer = null;

        function carregarDashboard(indice) {
            atual = (indice + dashboards.length) % dashboards.length;
            inicio = Date.now();
            loading.style.display = "grid";
            frame.src = dashboards[atual].url;
            title.textContent = dashboards[atual].titulo;
            counter.textContent = `${atual + 1} / ${dashboards.length}`;
            atualizarProgresso();
            reiniciarTimer();
        }

        function proximo() {
            carregarDashboard(atual + 1);
        }

        function anterior() {
            carregarDashboard(atual - 1);
        }

        function reiniciarTimer() {
            window.clearTimeout(timer);

            if (!pausado) {
                timer = window.setTimeout(proximo, intervaloMs);
            }
        }

        function atualizarProgresso() {
            if (!pausado) {
                const decorrido = Date.now() - inicio;
                const percentual = Math.min((decorrido / intervaloMs) * 100, 100);
                progressBar.style.width = `${percentual}%`;
            }
        }

        function alternarPausa() {
            pausado = !pausado;
            pauseBtn.textContent = pausado ? ">" : "||";
            pauseBtn.title = pausado ? "Continuar" : "Pausar";

            if (pausado) {
                window.clearTimeout(timer);
            } else {
                inicio = Date.now();
                reiniciarTimer();
            }
        }

        async function entrarTelaCheia() {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
                return;
            }

            await document.exitFullscreen();
        }

        frame.addEventListener("load", () => {
            loading.style.display = "none";
        });

        document.getElementById("nextBtn").addEventListener("click", proximo);
        document.getElementById("prevBtn").addEventListener("click", anterior);
        pauseBtn.addEventListener("click", alternarPausa);
        document.getElementById("fullscreenBtn").addEventListener("click", entrarTelaCheia);
        controlToggle.addEventListener("click", () => {
            document.body.classList.toggle("controls-open");
        });

        document.addEventListener("click", (event) => {
            if (!topbar.contains(event.target) && !controlToggle.contains(event.target)) {
                document.body.classList.remove("controls-open");
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight") proximo();
            if (event.key === "ArrowLeft") anterior();
            if (event.key === " ") alternarPausa();
            if (event.key.toLowerCase() === "f") entrarTelaCheia();
            if (event.key === "Escape") document.body.classList.remove("controls-open");
        });

        progressTimer = window.setInterval(atualizarProgresso, 1000);
        carregarDashboard(0);
    </script>
</body>
</html>
